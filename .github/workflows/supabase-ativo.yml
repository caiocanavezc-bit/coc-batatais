name: Manter o Supabase ativo

# O plano gratuito do Supabase pausa o projeto depois de 1 semana sem uso.
# A cada 3 dias esta tarefa faz uma leitura simples no mural dos aprovados,
# o que conta como uso e evita a pausa. Não grava nem altera nada.

on:
  schedule:
    - cron: '17 12 */3 * *'   # a cada 3 dias, 9h17 no horário de Brasília
  workflow_dispatch:           # permite rodar na mão pela aba Actions

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ler a conexão do site (URL e chave pública)
        id: cfg
        run: |
          url=$(grep -oP "url:\s*'\K[^']+" assets/supabase-config.js)
          key=$(grep -oP "anonKey:\s*'\K[^']+" assets/supabase-config.js)
          if [ -z "$url" ] || [ -z "$key" ]; then echo "::error::assets/supabase-config.js sem url ou anonKey"; exit 1; fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "key=$key" >> "$GITHUB_OUTPUT"

      - name: Consultar o mural
        run: |
          code=$(curl -s -o resposta.json -w '%{http_code}' \
            "${{ steps.cfg.outputs.url }}/rest/v1/aprovados?select=id&limit=1" \
            -H "apikey: ${{ steps.cfg.outputs.key }}")
          echo "Supabase respondeu $code"
          if [ "$code" != "200" ]; then
            echo "::error::O Supabase respondeu $code. Se o projeto foi pausado, reative em supabase.com > projeto > Restore."
            exit 1
          fi
